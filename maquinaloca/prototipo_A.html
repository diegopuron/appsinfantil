<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · Cajas con modelo</title><style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f1e8;overflow:hidden}
#game{height:100vh;display:grid;grid-template-rows:18% 37% 45%;align-items:center}
#rulePanel{justify-self:center;background:white;border:5px solid #333;border-radius:28px;padding:10px 24px;display:flex;gap:18px;transition:.2s}
.rule{font-size:42px;opacity:.18;filter:grayscale(1)} .rule.active{opacity:1;filter:none;transform:scale(1.12)}
#rulePanel.remind{transform:scale(1.12);box-shadow:0 0 0 10px rgba(0,0,0,.08)}
#object{justify-self:center;width:145px;height:145px;display:grid;place-items:center;font-size:115px;font-weight:bold;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.red{color:#d94435}.blue{color:#246bd6}
.destinations{display:flex;justify-content:space-around;align-items:center;width:100%;padding:0 8vw}
.dest{width:260px;height:220px;border:0;background:transparent;cursor:pointer;position:relative;font-size:70px}
.box{height:150px;background:#c9a46c;border:6px solid #5b4630;border-radius:18px 18px 28px 28px;display:grid;place-items:center;position:relative}
.slot{position:absolute;top:-18px;width:75%;height:35px;background:#292929;border-radius:50%;left:12.5%}
.model{background:white;border:5px solid #333;border-radius:18px;width:105px;height:105px;display:grid;place-items:center;font-size:80px;position:absolute;top:-80px;left:77px}
.creature{width:180px;height:180px;margin:auto;display:grid;place-items:center;font-size:118px;font-weight:bold;position:relative}
.creature:after{content:'◡';position:absolute;color:#222;font-size:55px;bottom:28px;left:64px}
.mouthModel{width:180px;height:180px;background:#ddd;border:6px solid #333;border-radius:32px;margin:auto;display:grid;place-items:center;position:relative}
.mouthModel .mouth{width:120px;height:105px;display:grid;place-items:center;font-size:90px;background:white;border:5px solid #333}
#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:72px}
#overlay{position:fixed;inset:0;background:rgba(245,241,232,.96);display:none;place-items:center;text-align:center;z-index:5}
#overlay.show{display:grid}.gear{font-size:100px;animation:spin .7s linear infinite}.big{font-size:90px;font-weight:bold}
@keyframes spin{to{transform:rotate(360deg)}}
#end{height:100vh;display:none;place-items:center;text-align:center;font-size:28px;padding:30px}
#end h1{font-size:42px;margin:0 0 20px}
.small{font-size:18px;margin-top:22px;color:#555}
@media(max-width:650px){.dest{width:42vw}.destinations{padding:0 2vw}.model{left:calc(50% - 52px)}}
</style></head>
<body>
<main id="game">
  <div id="rulePanel" aria-label="Regla activa">
    <span id="ruleColor" class="rule">🔴 🔵</span>
    <span id="ruleShape" class="rule">● ★</span>
  </div>
  <div id="object"></div>
  <div class="destinations"><button class="dest" id="left" aria-label="Destino izquierdo"><div class="box"><div class="slot"></div><div class="model red">●</div></div></button><button class="dest" id="right" aria-label="Destino derecho"><div class="box"><div class="slot"></div><div class="model blue">★</div></div></button></div>
  <div id="message"></div>
</main>
<div id="overlay"><div><div class="gear">⚙️</div><div class="big">🔴 🔵</div></div></div>
<section id="end"><div><h1>Fin del prototipo A</h1><div id="summary"></div>
<div class="small">Datos orientativos para comparar la interfaz. No constituyen una evaluación diagnóstica.</div></div></section>
<script>
const CFG = {"variant": "A"};
const trials = [
 {c:'red',s:'star'}, {c:'blue',s:'circle'}, {c:'red',s:'star'},
 {c:'blue',s:'circle'}, {c:'red',s:'star'}, {c:'blue',s:'circle'},
 {c:'red',s:'star'}, {c:'blue',s:'circle'}, {c:'red',s:'star'},
 {c:'blue',s:'circle'}, {c:'red',s:'star'}, {c:'blue',s:'circle'}
];
let i=0, rule='color', locked=false, firstTry=true, log=[];
const $=s=>document.querySelector(s);
const shapeIcon=s=>s==='circle'?'●':'★';
const colorName=c=>c==='red'?'rojo':'azul';
function renderObject(o){
  const el=$('#object');
  el.className='object '+o.c+' '+o.s;
  el.textContent=shapeIcon(o.s);
}
function correctSide(o){
  if(rule==='color') return o.c==='red'?'left':'right';
  return o.s==='circle'?'left':'right';
}
function oldRuleSide(o){
  if(rule==='shape') return o.c==='red'?'left':'right';
  return null;
}
function updateRule(){
  $('#ruleColor').classList.toggle('active',rule==='color');
  $('#ruleShape').classList.toggle('active',rule==='shape');
}
function next(){
  locked=false; firstTry=true;
  renderObject(trials[i]);
  $('#message').textContent='';
}
function choose(side){
 if(locked) return;
 const o=trials[i], ok=side===correctSide(o);
 log.push({trial:i+1,rule,color:o.c,shape:o.s,side,correct:ok,firstTry,
           oldRuleCompatible: rule==='shape' && side===oldRuleSide(o)});
 if(ok){
   locked=true;
   $('#message').textContent='✨';
   setTimeout(()=>{
     i++;
     if(i===6){ changeRule(); return; }
     if(i>=trials.length){ finish(); return; }
     next();
   },550);
 } else {
   firstTry=false;
   $('#message').textContent='↩';
   $('#rulePanel').classList.add('remind');
   setTimeout(()=>{$('#rulePanel').classList.remove('remind'); $('#message').textContent='';},850);
 }
}
function changeRule(){
 locked=true;
 $('#object').style.visibility='hidden';
 $('#overlay').classList.add('show');
 setTimeout(()=>{
   rule='shape'; updateRule();
   $('#overlay').innerHTML='<div class="gear">⚙️</div><div class="big">● &nbsp; ★</div>';
 },700);
 setTimeout(()=>{
   $('#overlay').classList.remove('show');
   $('#object').style.visibility='visible';
   next();
 },2200);
}
function finish(){
 locked=true;
 $('#game').style.display='none';
 $('#end').style.display='grid';
 const first = log.filter(x=>x.firstTry);
 const pre=first.filter(x=>x.rule==='color');
 const post=first.filter(x=>x.rule==='shape');
 const n=a=>a.filter(x=>x.correct).length;
 $('#summary').innerHTML=`Color: ${n(pre)}/${pre.length} primeros intentos<br>
 Cambio a forma: ${n(post)}/${post.length} primeros intentos<br>
 Respuestas compatibles con regla anterior: ${post.filter(x=>!x.correct&&x.oldRuleCompatible).length}`;
}
window.addEventListener('DOMContentLoaded',()=>{
 document.body.dataset.variant=CFG.variant;
 $('#left').onclick=()=>choose('left');
 $('#right').onclick=()=>choose('right');
 updateRule(); next();
});
</script></body></html>
